[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fgcl"
version = "0.3.0"
description = "Fourier, Geometry, Computation & Logic: reproducible numerical experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
[project.optional-dependencies]
images = ["pillow>=9", "scipy>=1.10"]
torch = ["torch>=2", "torchvision>=0.15", "pillow>=9", "scipy>=1.10"]
xai = ["torch>=2", "captum>=0.7"]
[tool.setuptools.packages.find]
include = ["fgcl*"]

[tool.setuptools.package-data]
fgcl = ["route_web/*.html", "route_web/*.css", "route_web/*.js"]
